    tier: 3
    platform: youtube
    channelId: UC2V_LHwvaNS2XWZ5l8x3jLQ
    enabled: true
    regions: [US]
    # Series-specific coverage evidence only (never a blanket bilateral rule). Add a series when Willow is
    # observed publishing its highlights; discovery reports uncovered series as no_trusted_source:series:<id>.
    competitions: [series:24289, series:24203, series:23802, series:24677]
    verification:
      status: verified
      verifiedAt: "2026-10-03"
      evidenceUrl: https://www.willow.tv/
      method: >-
        willow.tv links https://www.youtube.com/@willow, whose channel is UC2V_LHwvaNS2XWZ5l8x3jLQ ("Willow by Cricbuzz"; resolves the
        @WillowTVCricket ambiguity, that handle does not exist). Coverage observed 2026-10-03: West Indies tour of India (24289),
        Australia tour of South Africa (24203), Sri Lanka tour of England (23802), Afghanistan tour of India (24677).
