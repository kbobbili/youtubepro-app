    verification:
      status: verified
      verifiedAt: "2026-10-03"
      evidenceUrl: https://www.formula1.com/
      method: >-
        formula1.com links https://www.youtube.com/c/f1, whose canonical channel is UCB_qr75-ydFVKSF9Dmo6izg (@formula1).
        Coverage: "Race Highlights | 2026 <GP>" uploads observed for the Italian, Spanish and Azerbaijan GPs.

