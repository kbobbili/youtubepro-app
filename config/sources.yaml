# Trusted source registry (see docs/04-source-registry.md).
#
# Only `enabled: true` entries with `verification.status: verified` are trusted.
# Verified requires authoritative ownership evidence: an official publisher page linking
# to the channel, resolved to an immutable channel ID. Handle/ID/RSS agreement alone only
# proves identity consistency, not authorization.
#
# Candidate IDs came from desk research on 2026-10-02 (@handle → channel ID → RSS title).
# They are NOT trusted until ownership evidence is recorded.
#
# Ownership and coverage are separate checks. `competitions` scopes each source to what it was observed
# to publish (adapter keys: NFL, F1, ESPN league slugs, atp, cricket series:<ESPN series id>). Events in any
# other competition get "no trusted source" (highlight unavailable), never a guessed source.

sources:
  - id: nfl-youtube
    sport: nfl
    displayName: NFL
    tier: 1
    platform: youtube
    channelId: UCDVYQ4Zhbm3S2dlz7P1GBDg
    enabled: true
    regions: [US]
    competitions: [NFL]
    verification:
      status: verified
      verifiedAt: "2026-10-02"
      evidenceUrl: https://www.nfl.com/
      method: >-
        nfl.com footer "Youtube" link → https://www.youtube.com/user/NFL/ ;
        YouTube channels.list(forUsername=NFL) → UCDVYQ4Zhbm3S2dlz7P1GBDg (@nfl).

  - id: f1-youtube
    sport: f1
    displayName: Formula 1
    tier: 1
