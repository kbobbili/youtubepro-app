# Collections for the SmartTube/YouTube-playlist delivery EXPERIMENT (docs/07 open decisions, docs/08).
# Rules over stored events and highlights, not over the 7-day library export. Every number here is a
# configuration hypothesis, not a product decision. Collections are browsing lists, not a Catch Me Up queue.

publishing:
  # Safety rail, not a throttle: the project's default YouTube quota is 10,000 units/day, shared with discovery.
  # Stopping the publisher at 8,000 keeps ~2,000 for discovery so a large backfill can't blind it until midnight PT.
  dailyBudgetUnits: 8000          # per Pacific-time quota day; reads and attempted writes count
  writesPerCollectionPerRun: 50   # fills a playlist in one run; collections are processed in the order listed below
  maxMetadataAgeHours: 24         # retained videos are re-checked when their last check is older
  maxDiscoveryAgeHours: 6         # a sport whose latest discovery run is older is incomplete (keeps last-known-good)
  includeFlaggedTitles: false     # explicit overrides only; any override is shown in the dry run
  includeUnreviewedTitles: false

# Playlist rules (user decisions 2026-10-03). Every playlist is ordered newest YouTube upload first.
# `keep` decides membership; only watchable highlights count, so an event without a trusted source never takes
# a slot. Leaving a playlist never deletes stored history. The NFL and Soccer playlists were dropped: the team
# playlists cover the same games.
collections:
  - id: this-week
    title: "SportsCenter · This Week"
    kind: mixed
    keep: { days: 7 }               # everything from the last 7 days, no count limit
    excludeSports: [tennis]         # tennis has its own playlist
    publish: true

  - id: bills
    title: "SportsCenter · Bills"
    kind: team
    sport: nfl
    team: BUF
    keep: { last: 7 }
    publish: true

  - id: 49ers
    title: "SportsCenter · 49ers"
    kind: team
    sport: nfl
    team: SF
    keep: { last: 7 }
    publish: true

  - id: arsenal
    title: "SportsCenter · Arsenal"
    kind: team
    sport: soccer
    team: "359"
    keep: { last: 7 }               # across every competition with a trusted US source
    publish: true

  - id: real-madrid
    title: "SportsCenter · Real Madrid"
    kind: team
    sport: soccer
    team: "86"
    keep: { last: 7 }
    publish: true

  - id: f1
    title: "SportsCenter · F1"
    kind: sport
    sport: f1
    keep: { last: 7 }               # race highlights
    publish: true

  - id: cricket
    title: "SportsCenter · Cricket"
    kind: sport
    sport: cricket
    keep: { last: 14 }              # all followed nations
    publish: true

  - id: india
    title: "SportsCenter · India"
    kind: team
    sport: cricket
    team: "6"
    keep: { last: 7 }
    publish: true

  - id: tennis
    title: "SportsCenter · Tennis"
    kind: sport
    sport: tennis
    # Tournaments in progress or finished in the last 7 days; quarterfinals onward (Grand Slams: round of 16 onward).
    # Name order in ATP titles hints at the winner; accepted by the user (2026-10-03).
    keep: { tournaments: { finishedWithinDays: 7, fromStage: qf, majorsFromStage: r16 } }
    publish: true
