# Collections for the SmartTube/YouTube-playlist delivery EXPERIMENT (docs/07 open decisions, docs/08).
# Rules over stored events and highlights, not over the 7-day library export. Every number here is a
# configuration hypothesis, not a product decision. Collections are browsing lists, not a Catch Me Up queue.

publishing:
  dailyBudgetUnits: 3000          # per Pacific-time quota day; reads and attempted writes count
  writesPerCollectionPerRun: 5    # collections are processed in the order listed below
  maxMetadataAgeHours: 24         # retained videos are re-checked when their last check is older
  includeFlaggedTitles: false     # explicit overrides only; any override is shown in the dry run
  includeUnreviewedTitles: false

# Only NFL collections exist while NFL is the only sport with an adapter. Expansion target, enabled
# incrementally after the Onn device gate passes and each sport is audited:
#   sport: f1, soccer, tennis, cricket    team: arsenal, real-madrid, india
collections:
  - id: nfl
    title: "SportsCenter · NFL"
    kind: sport
    sport: nfl
    windowDays: 30
    cap: 50
    publish: true                 # the first and only published collection until the Onn gate passes

  - id: this-week
    title: "SportsCenter · This Week"
    kind: mixed
    windowDays: 7
    cap: 40
    perSportCaps: { tennis: 10 }
    publish: false

  - id: bills
    title: "SportsCenter · Bills"
    kind: team
    sport: nfl
    team: BUF
    windowDays: 30
    cap: 30
    publish: false

  - id: 49ers
    title: "SportsCenter · 49ers"
    kind: team
    sport: nfl
    team: SF
    windowDays: 30
    cap: 30
    publish: false
